<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentMemory Universal — Cognitive Hub</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg: #07080c;
      --surface: #10121a;
      --surface-elevated: #161924;
      --surface-border: #1e2232;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.3);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Vazirmatn", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--surface-border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }
    .brand span.badge {
      font-size: 0.72rem;
      background: var(--accent-glow);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.4);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 500;
    }
    nav {
      display: flex;
      gap: 8px;
    }
    nav button {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    nav button:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
    }
    nav button.active {
      background: var(--surface-border);
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.08);
    }
    main {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }
    .tab-content {
      display: none;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .tab-content.active {
      display: flex;
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 18px;
      padding: 8px 24px;
      background: rgba(16, 18, 26, 0.75);
      border-bottom: 1px solid var(--surface-border);
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .stats-item strong {
      color: var(--text);
      font-weight: 600;
      margin-left: 4px;
    }

    /* --- Obsidian Graph View --- */
    #graph-container {
      width: 100%;
      height: 100%;
      position: relative;
      background: radial-gradient(circle at 50% 50%, #0d0f18 0%, #06070a 100%);
    }
    #graph-svg {
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #graph-svg:active { cursor: grabbing; }

    /* Graph Floating Control Bar */
    .graph-controls {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 18, 26, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 6px 12px;
      z-index: 5;
    }
    .graph-controls input {
      background: var(--surface-elevated);
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      color: var(--text);
      padding: 5px 10px;
      font-size: 0.82rem;
      outline: none;
      width: 160px;
    }
    .graph-controls input:focus { border-color: var(--accent); }
    .graph-controls label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }
    .btn-icon {
      background: var(--surface-elevated);
      border: 1px solid var(--surface-border);
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.15s ease;
    }
    .btn-icon:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }

    /* Graph Inspector Drawer (Right) */
    .graph-drawer {
      position: absolute;
      top: 16px;
      right: 16px;
      bottom: 16px;
      width: 380px;
      background: rgba(16, 18, 26, 0.94);
      backdrop-filter: blur(16px);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius);
      padding: 20px;
      display: none;
      flex-direction: column;
      gap: 14px;
      z-index: 5;
      overflow-y: auto;
      box-shadow: 0 12px 36px rgba(0,0,0,0.6);
      animation: slideIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideIn {
      from { transform: translateX(20px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .drawer-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      word-break: break-word;
    }
    .drawer-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
    }
    .drawer-close:hover { color: var(--text); }
    .badge-pill {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      width: fit-content;
    }
    .drawer-section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      margin-top: 6px;
      font-weight: 600;
    }
    .drawer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .link-chip {
      background: var(--surface-elevated);
      border: 1px solid var(--surface-border);
      color: var(--text-muted);
      font-size: 0.76rem;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .link-chip:hover {
      color: var(--text);
      border-color: var(--accent);
      background: var(--accent-glow);
    }
    .drawer-fact-card {
      background: var(--surface-elevated);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.82rem;
    }
    .drawer-fact-pred {
      color: #f472b6;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .drawer-fact-obj {
      color: var(--text);
      line-height: 1.4;
      word-break: break-word;
    }

    /* Core Blocks View */
    .blocks-container { display: flex; width: 100%; height: 100%; }
    .blocks-sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--surface-border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
    }
    .block-nav-item {
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.88rem;
      color: var(--text-muted);
      transition: background 0.15s ease;
      display: flex;
      justify-content: space-between;
    }
    .block-nav-item:hover { background: rgba(255,255,255,0.03); color: var(--text); }
    .block-nav-item.active { background: var(--accent-glow); color: #818cf8; font-weight: 600; }
    .block-editor-area {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--bg);
    }
    .editor-header { display: flex; justify-content: space-between; align-items: center; }
    textarea.block-editor {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9rem;
      resize: none;
      outline: none;
    }
    textarea.block-editor:focus { border-color: var(--accent); }
    .btn {
      background: var(--accent);
      border: none;
      color: white;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: opacity 0.15s ease;
    }
    .btn:hover { opacity: 0.9; }

    /* Facts View */
    .facts-container {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .fact-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .fact-card.superseded { opacity: 0.45; border-color: #332020; }
    .fact-header { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-muted); }
    .fact-triple { font-size: 0.95rem; font-weight: 600; color: #e2e8f0; display: flex; gap: 8px; align-items: center; }
    .fact-triple .subj { color: #38bdf8; }
    .fact-triple .pred { color: #f472b6; font-size: 0.85rem; font-weight: 400; }
    .fact-triple .obj { color: #4ade80; }
    .fact-evidence { font-size: 0.8rem; color: var(--text-muted); border-left: 2px solid var(--surface-border); padding-left: 8px; margin-top: 4px; }

    /* Search View */
    .search-container { flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 16px; max-width: 900px; margin: 0 auto; width: 100%; overflow-y: auto; }
    .search-box { display: flex; gap: 8px; }
    .search-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 12px 16px;
      font-size: 0.95rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-result {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .search-result .type-badge { font-size: 0.72rem; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.06); width: fit-content; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      🧠 AgentMemory Universal
      <span class="badge">v3.5 Native Pure Go</span>
    </div>
    <nav>
      <button class="active" onclick="switchTab('graph')">🕸️ Knowledge Graph</button>
      <button onclick="switchTab('blocks')">🧩 Core Blocks (Letta)</button>
      <button onclick="switchTab('facts')">⏳ Bi-Temporal Facts</button>
      <button onclick="switchTab('search')">⚡ Hybrid Search</button>
    </nav>
  </header>

  <div class="stats-bar" id="stats-bar">
    <div class="stats-item">Active Facts: <strong id="stat-active-facts">-</strong></div>
    <div class="stats-item">Total Facts: <strong id="stat-total-facts">-</strong></div>
    <div class="stats-item">Entities: <strong id="stat-entities">-</strong></div>
    <div class="stats-item">Graph Relations: <strong id="stat-relations">-</strong></div>
    <div class="stats-item">Core Blocks: <strong id="stat-blocks">-</strong></div>
    <div class="stats-item">Embedded Chunks: <strong id="stat-chunks">-</strong></div>
  </div>

  <main>
    <!-- Graph Tab -->
    <div class="tab-content active" id="tab-graph">
      <div id="graph-container">
        <!-- Controls Floating Pill -->
        <div class="graph-controls">
          <input type="text" id="graph-search" placeholder="Search node..." oninput="filterGraph()">
          <label>
            <input type="checkbox" id="graph-hide-isolated" checked onchange="loadGraph()">
            Hide isolated
          </label>
          <button class="btn-icon" onclick="zoomIn()" title="Zoom In">+</button>
          <button class="btn-icon" onclick="zoomOut()" title="Zoom Out">−</button>
          <button class="btn-icon" onclick="resetZoom()" title="Reset View">⊙</button>
        </div>

        <svg id="graph-svg"></svg>

        <!-- Obsidian-Style Inspector Drawer -->
        <div class="graph-drawer" id="graph-drawer">
          <div class="drawer-header">
            <div>
              <div class="drawer-title" id="drawer-title">Entity Name</div>
              <div class="badge-pill" id="drawer-badge" style="margin-top:6px;">Concept</div>
            </div>
            <button class="drawer-close" onclick="closeDrawer()">✕</button>
          </div>

          <div>
            <div class="drawer-section-title">Connections (<span id="drawer-conn-count">0</span>)</div>
            <div class="drawer-links" id="drawer-links" style="margin-top:6px;"></div>
          </div>

          <div id="drawer-facts-section" style="display:none;">
            <div class="drawer-section-title">Related Facts & Assertions</div>
            <div id="drawer-facts-list" style="margin-top:6px; display:flex; flex-direction:column; gap:8px;"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Core Blocks Tab -->
    <div class="tab-content" id="tab-blocks">
      <div class="blocks-container">
        <div class="blocks-sidebar" id="blocks-sidebar"></div>
        <div class="block-editor-area">
          <div class="editor-header">
            <h2 id="active-block-title">Select a Block</h2>
            <button class="btn" onclick="saveCurrentBlock()">💾 Save Block</button>
          </div>
          <textarea class="block-editor" id="block-content-editor" placeholder="Block content..."></textarea>
        </div>
      </div>
    </div>

    <!-- Facts Tab -->
    <div class="tab-content" id="tab-facts">
      <div class="facts-container" id="facts-list"></div>
    </div>

    <!-- Search Tab -->
    <div class="tab-content" id="tab-search">
      <div class="search-container">
        <div class="search-box">
          <input type="text" class="search-input" id="search-query" placeholder="Ask memory (e.g. compositor, user preferences, literature)..." onkeydown="if(event.key==='Enter') executeSearch()">
          <button class="btn" onclick="executeSearch()">🔍 4-Way Search</button>
        </div>
        <div id="search-results" style="display:flex; flex-direction:column; gap:12px;"></div>
      </div>
    </div>
  </main>

  <script>
    let activeBlockLabel = null;
    let allBlocks = [];
    let graphData = { nodes: [], links: [] };
    let simulation = null;
    let svgZoom = null;
    let mainSvgGroup = null;

    function switchTab(name) {
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab-' + name).classList.add('active');

      if (name === 'graph') loadGraph();
      if (name === 'blocks') loadBlocks();
      if (name === 'facts') loadFacts();
    }

    async function fetchStats() {
      try {
        const res = await fetch('/api/stats');
        const d = await res.json();
        document.getElementById('stat-active-facts').textContent = d.facts_active;
        document.getElementById('stat-total-facts').textContent = d.facts_total;
        document.getElementById('stat-entities').textContent = d.entities_count;
        document.getElementById('stat-relations').textContent = d.relations_count;
        document.getElementById('stat-blocks').textContent = d.blocks_count;
        document.getElementById('stat-chunks').textContent = d.chunks_count;
      } catch (e) { console.error(e); }
    }

    /* --- Obsidian Knowledge Graph --- */
    function getNodeColor(d) {
      const ns = (d.namespace || '').toLowerCase();
      const type = (d.type || '').toLowerCase();
      if (ns.includes('system') || ns.includes('infra')) return '#38bdf8'; // Sky
      if (ns.includes('ai') || type.includes('tool')) return '#a855f7';     // Purple
      if (type === 'subject') return '#818cf8';                            // Indigo
      if (type === 'section') return '#f472b6';                            // Rose
      if (ns.includes('user') || ns.includes('human')) return '#10b981';   // Emerald
      if (ns.includes('forex')) return '#14b8a6';                          // Teal
      if (ns.includes('ecommerce')) return '#f59e0b';                      // Amber
      return '#6366f1';                                                    // Default Accent
    }

    function getNodeRadius(d) {
      const degree = d.degree || 0;
      return Math.max(4.5, Math.min(18, 4.5 + Math.sqrt(degree) * 2.8));
    }

    function getTruncatedLabel(label) {
      if (!label) return '';
      return label.length > 16 ? label.slice(0, 14) + '…' : label;
    }

    async function loadGraph() {
      const container = document.getElementById("graph-container");
      const width = container.clientWidth || 1000;
      const height = container.clientHeight || 700;

      const svg = d3.select("#graph-svg");
      svg.selectAll("*").remove();

      // SVG Glow Filter
      const defs = svg.append("defs");
      const filter = defs.append("filter").attr("id", "neon-glow").attr("x", "-50%").attr("y", "-50%").attr("width", "200%").attr("height", "200%");
      filter.append("feGaussianBlur").attr("stdDeviation", "2.5").attr("result", "coloredBlur");
      const feMerge = filter.append("feMerge");
      feMerge.append("feMergeNode").attr("in", "coloredBlur");
      feMerge.append("feMergeNode").attr("in", "SourceGraphic");

      mainSvgGroup = svg.append("g");
      svgZoom = d3.zoom().scaleExtent([0.15, 5]).on("zoom", (e) => mainSvgGroup.attr("transform", e.transform));
      svg.call(svgZoom);

      const res = await fetch('/api/graph');
      const rawData = await res.json();
      if (!rawData.nodes || rawData.nodes.length === 0) return;

      const hideIsolated = document.getElementById('graph-hide-isolated').checked;
      let nodes = rawData.nodes;
      let links = rawData.links;

      if (hideIsolated) {
        nodes = nodes.filter(n => (n.degree || 0) > 0);
        const nodeSet = new Set(nodes.map(n => n.id));
        links = links.filter(l => nodeSet.has(l.source) && nodeSet.has(l.target));
      }

      graphData = { nodes, links };

      simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(80).strength(0.4))
        .force("charge", d3.forceManyBody().strength(d => -80 - (d.degree || 0) * 15))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collision", d3.forceCollide().radius(d => getNodeRadius(d) + 12));

      // Edges
      const link = mainSvgGroup.append("g")
        .selectAll("line")
        .data(links)
        .join("line")
        .attr("stroke", "rgba(148, 163, 184, 0.16)")
        .attr("stroke-width", d => Math.max(1, (d.weight || 1) * 1.2));

      // Node Groups
      const node = mainSvgGroup.append("g")
        .selectAll("g")
        .data(nodes)
        .join("g")
        .attr("class", "graph-node-group")
        .call(d3.drag()
          .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
          .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
          .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
        );

      // Circles
      node.append("circle")
        .attr("r", d => getNodeRadius(d))
        .attr("fill", d => getNodeColor(d))
        .attr("stroke", "#07080c")
        .attr("stroke-width", 1.8)
        .attr("filter", d => (d.degree || 0) >= 4 ? "url(#neon-glow)" : null);

      // Clean Labels: only show for degree >= 2 by default
      node.append("text")
        .text(d => getTruncatedLabel(d.label))
        .attr("x", d => getNodeRadius(d) + 4)
        .attr("y", 3)
        .attr("fill", "#cbd5e1")
        .attr("font-size", "9.5px")
        .attr("font-weight", d => (d.degree || 0) >= 4 ? "600" : "400")
        .attr("style", d => (d.degree || 0) < 2 ? "display: none;" : "")
        .attr("pointer-events", "none");

      // Hover Interaction: Highlight neighborhood
      node.on("mouseenter", (e, d) => {
        const neighborSet = new Set([d.id]);
        links.forEach(l => {
          if (l.source.id === d.id) neighborSet.add(l.target.id);
          if (l.target.id === d.id) neighborSet.add(l.source.id);
        });

        node.style("opacity", n => neighborSet.has(n.id) ? 1 : 0.15);
        link.style("stroke-opacity", l => (l.source.id === d.id || l.target.id === d.id) ? 0.9 : 0.05)
            .style("stroke", l => (l.source.id === d.id || l.target.id === d.id) ? "#818cf8" : "rgba(148, 163, 184, 0.16)")
            .style("stroke-width", l => (l.source.id === d.id || l.target.id === d.id) ? 2 : 1);

        // Show text label on hover
        d3.select(e.currentTarget).select("text").style("display", "block").attr("fill", "#ffffff");
      });

      node.on("mouseleave", (e, d) => {
        node.style("opacity", 1);
        link.style("stroke-opacity", 0.6)
            .style("stroke", "rgba(148, 163, 184, 0.16)")
            .style("stroke-width", d => Math.max(1, (d.weight || 1) * 1.2));

        if ((d.degree || 0) < 2) {
          d3.select(e.currentTarget).select("text").style("display", "none");
        }
      });

      // Click: Open Obsidian-style detail drawer
      node.on("click", (e, d) => {
        openDrawer(d);
      });

      simulation.on("tick", () => {
        link
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);
        node.attr("transform", d => `translate(${d.x},${d.y})`);
      });
    }

    function openDrawer(d) {
      const drawer = document.getElementById("graph-drawer");
      drawer.style.display = "flex";

      document.getElementById("drawer-title").textContent = d.id;
      document.getElementById("drawer-badge").textContent = `${d.type || 'concept'} • ${d.namespace || 'default'}`;

      // Calculate neighbors
      const neighbors = [];
      graphData.links.forEach(l => {
        if (l.source.id === d.id) neighbors.push({ id: l.target.id, rel: l.relation });
        if (l.target.id === d.id) neighbors.push({ id: l.source.id, rel: l.relation });
      });

      document.getElementById("drawer-conn-count").textContent = neighbors.length;
      const linksContainer = document.getElementById("drawer-links");
      linksContainer.innerHTML = '';
      if (neighbors.length === 0) {
        linksContainer.innerHTML = '<span style="color:var(--text-dim);font-size:0.8rem;">No direct connections</span>';
      } else {
        neighbors.forEach(n => {
          const chip = document.createElement("span");
          chip.className = "link-chip";
          chip.textContent = `${n.rel ? n.rel + ' → ' : ''}${n.id}`;
          chip.onclick = () => {
            const target = graphData.nodes.find(node => node.id === n.id);
            if (target) openDrawer(target);
          };
          linksContainer.appendChild(chip);
        });
      }

      // Render Facts section
      const factsSection = document.getElementById("drawer-facts-section");
      const factsList = document.getElementById("drawer-facts-list");
      factsList.innerHTML = '';
      if (d.facts && d.facts.length > 0) {
        factsSection.style.display = "block";
        d.facts.forEach(f => {
          const card = document.createElement("div");
          card.className = "drawer-fact-card";
          card.innerHTML = `
            <div class="drawer-fact-pred">${f.predicate || 'asserts'}</div>
            <div class="drawer-fact-obj">${f.object}</div>
          `;
          factsList.appendChild(card);
        });
      } else {
        factsSection.style.display = "none";
      }
    }

    function closeDrawer() {
      document.getElementById("graph-drawer").style.display = "none";
    }

    function filterGraph() {
      const q = document.getElementById("graph-search").value.toLowerCase().trim();
      if (!mainSvgGroup) return;
      if (!q) {
        mainSvgGroup.selectAll(".graph-node-group").style("opacity", 1);
        return;
      }
      mainSvgGroup.selectAll(".graph-node-group").style("opacity", d => {
        return (d.id.toLowerCase().includes(q) || d.label.toLowerCase().includes(q)) ? 1 : 0.1;
      });
    }

    function zoomIn() {
      d3.select("#graph-svg").transition().duration(250).call(svgZoom.scaleBy, 1.35);
    }
    function zoomOut() {
      d3.select("#graph-svg").transition().duration(250).call(svgZoom.scaleBy, 0.75);
    }
    function resetZoom() {
      d3.select("#graph-svg").transition().duration(350).call(svgZoom.transform, d3.zoomIdentity);
    }

    /* --- Core Blocks --- */
    async function loadBlocks() {
      const res = await fetch('/api/blocks');
      allBlocks = await res.json();
      const sidebar = document.getElementById('blocks-sidebar');
      sidebar.innerHTML = '';
      allBlocks.forEach(b => {
        const item = document.createElement('div');
        item.className = 'block-nav-item' + (b.label === activeBlockLabel ? ' active' : '');
        item.innerHTML = `<span>${b.label}</span>`;
        item.onclick = () => selectBlock(b);
        sidebar.appendChild(item);
      });
      if (allBlocks.length > 0 && !activeBlockLabel) {
        selectBlock(allBlocks[0]);
      }
    }

    function selectBlock(block) {
      activeBlockLabel = block.label;
      document.querySelectorAll('.block-nav-item').forEach(el => {
        el.classList.toggle('active', el.textContent.trim() === block.label);
      });
      document.getElementById('active-block-title').textContent = 'Block: ' + block.label;
      document.getElementById('block-content-editor').value = block.content;
    }

    async function saveCurrentBlock() {
      if (!activeBlockLabel) return;
      const content = document.getElementById('block-content-editor').value;
      const res = await fetch('/api/blocks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ label: activeBlockLabel, content })
      });
      if (res.ok) {
        alert('Block saved successfully!');
        loadBlocks();
        fetchStats();
      }
    }

    /* --- Facts --- */
    async function loadFacts() {
      const res = await fetch('/api/facts?active=false');
      const facts = await res.json();
      const container = document.getElementById('facts-list');
      container.innerHTML = '';
      facts.forEach(f => {
        const card = document.createElement('div');
        card.className = 'fact-card' + (f.is_active ? '' : ' superseded');
        card.innerHTML = `
          <div class="fact-header">
            <span>[${f.namespace}] ${f.is_active ? '🟢 Active' : '🔴 Superseded'}</span>
            <span>Recorded: ${new Date(f.recorded_at).toLocaleDateString()}</span>
          </div>
          <div class="fact-triple">
            <span class="subj">${f.subject}</span>
            <span class="pred">${f.predicate}</span>
            <span class="obj">${f.object}</span>
          </div>
          ${f.source_quote ? `<div class="fact-evidence">"${f.source_quote}"</div>` : ''}
        `;
        container.appendChild(card);
      });
    }

    /* --- Search --- */
    async function executeSearch() {
      const query = document.getElementById('search-query').value.trim();
      if (!query) return;
      const res = await fetch('/api/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, top_k: 6 })
      });
      const results = await res.json();
      const container = document.getElementById('search-results');
      container.innerHTML = '';
      if (!results || results.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted)">No matches found.</p>';
        return;
      }
      results.forEach(r => {
        const item = document.createElement('div');
        item.className = 'search-result';
        item.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="type-badge">[${r.type.toUpperCase()}] ${r.namespace}</span>
            <span style="font-size:0.75rem; color:#818cf8;">RRF Score: ${r.score.toFixed(4)}</span>
          </div>
          ${r.title ? `<strong style="font-size:0.95rem;">${r.title}</strong>` : ''}
          <div style="font-size:0.88rem; color:var(--text-muted);">${r.content}</div>
        `;
        container.appendChild(item);
      });
    }

    // Initialize
    fetchStats();
    loadGraph();
  </script>
</body>
</html>
