<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Deep Space Void Gradient -->
    <radialGradient id="void-glow" cx="50%" cy="80%" r="90%">
      <stop offset="0%" stop-color="#121118" />
      <stop offset="50%" stop-color="#08070c" />
      <stop offset="100%" stop-color="#020203" />
    </radialGradient>

    <!-- Radiance of the Golden Core -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="1" />
      <stop offset="15%" stop-color="#fcd34d" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#b45309" stop-opacity="0.3" />
      <stop offset="80%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Liquid Horizon Gradient -->
    <linearGradient id="horizon-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020203" stop-opacity="0"/>
      <stop offset="10%" stop-color="#100e16" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020203" stop-opacity="1"/>
    </linearGradient>

    <!-- Ripple Gradient for depth -->
    <linearGradient id="ripple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#fcd34d" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Absolute Void Background -->
  <rect width="1200" height="420" fill="#020203" />
  <rect width="1200" height="420" fill="url(#void-glow)" opacity="0.8" />

  <!-- The Horizon & Liquid Plane -->
  <g transform="translate(0, 260)">
    <!-- Deep liquid fade -->
    <rect x="0" y="-80" width="1200" height="240" fill="url(#horizon-fade)" />
    
    <!-- Concentric Time Ripples (Bi-Temporal Horizons) -->
    <g transform="scale(1, 0.25)">
      <!-- Outer echoes of memory -->
      <circle cx="600" cy="0" r="1000" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.1"/>
      <circle cx="600" cy="0" r="800" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.05"/>
      <circle cx="600" cy="0" r="620" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-opacity="0.1"/>
      <circle cx="600" cy="0" r="480" fill="none" stroke="url(#ripple-grad)" stroke-width="2"/>
      <circle cx="600" cy="0" r="350" fill="none" stroke="url(#ripple-grad)" stroke-width="2.5"/>
      <circle cx="600" cy="0" r="240" fill="none" stroke="#d4af37" stroke-width="3" stroke-opacity="0.4"/>
      <circle cx="600" cy="0" r="150" fill="none" stroke="#fcd34d" stroke-width="5" stroke-opacity="0.7"/>
      <circle cx="600" cy="0" r="85" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.9"/>
    </g>
  </g>

  <!-- The Core (Cognitive Sphere) -->
  <g transform="translate(600, 215)">
    <!-- Vast glowing aura -->
    <circle cx="0" cy="0" r="180" fill="url(#core-glow)" filter="url(#soft-blur)" />
    <circle cx="0" cy="0" r="90" fill="url(#core-glow)" />
    <!-- Solid Sphere -->
    <circle cx="0" cy="0" r="42" fill="#fef08a" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8"/>
    <!-- Subtle eclipse shadow on sphere -->
    <path d="M 0 -42 A 42 42 0 0 0 0 42 A 22 42 0 0 1 0 -42 Z" fill="#000000" fill-opacity="0.4" />
  </g>

  <!-- Minimalist Cinematic Typography -->
  <g transform="translate(600, 360)">
    <!-- Title -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', serif" font-size="28" font-weight="300" fill="#f8fafc" letter-spacing="10" text-anchor="middle">
      A G E N T — M E M O R Y
    </text>
    <!-- Subtitle -->
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="400" fill="#94a3b8" letter-spacing="4" text-anchor="middle" opacity="0.6">
      UNIVERSAL COGNITIVE ENGINE
    </text>
  </g>

  <!-- Delicate Frame / Vignette -->
  <rect x="30" y="30" width="1140" height="360" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.06" />
  
  <!-- Subtle Coordinates -->
  <text x="50" y="55" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b" letter-spacing="2" opacity="0.4">
    VOL: &lt;15MB
  </text>
  <text x="1150" y="55" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b" letter-spacing="2" text-anchor="end" opacity="0.4">
    CGO: ZERO
  </text>
</svg>